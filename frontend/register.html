<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - InternHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff, #ffffff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .register-container {
            width: 420px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;

            color: #2563eb;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .title {
            text-align: center;

            font-size: 24px;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background-color: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .register-btn:hover {
            background-color: #1d4ed8;
        }

        .login-text {
            text-align: center;

            margin-top: 25px;

            color: #6b7280;
        }

        .login-text a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #374151;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="register-container">

        <div class="logo">
            InternHub
        </div>

        <h2 class="title">
            Create Account
        </h2>

        <p class="subtitle">
            Start your internship journey today
        </p>


        <form>

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>


        <p class="login-text">
            Already have an account?

            <a href="login.html">
                Login
            </a>
        </p>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>

</html>
